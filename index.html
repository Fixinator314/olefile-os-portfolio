<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Olefile Makganye's Portfolio</title>
    <meta
      name="description"
      content="Official portfolio website for Olefile Makganye"
    />

    <!-- Fonts (premium feel) -->

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./assets/css/label.css" />
    <link rel="stylesheet" href="./assets/css/responses.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/HQ logo/HQ Logo.png"
      alt="HQ Logo"
    />

    <!-- GSAP -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script> -->
  </head>

  <body>
    <section class="os-desktop">
      <!-- <p class="label">Desktop View</p> -->

      <div class="task-bar">
        <!-- START BUTTON -->

        <div class="start-button">
          <img
            src="./assets/Logo/om-logo.png"
            alt="Logo"
            class="start-menu-logo"
          />
        </div>

        <!-- TASKBAR APPS -->

        <div class="taskbar-apps">
          <div class="taskbar-icon active-taskbar-app">
            <img src="./assets/icons/work.png" alt="Work" />
          </div>

          <div class="taskbar-icon">
            <img src="./assets/icons/music.png" alt="Music" />
          </div>

          <div class="taskbar-icon">
            <img src="./assets/icons/archive.png" alt="Archive" />
          </div>

          <div class="taskbar-icon">
            <img src="./assets/icons/contact.png" alt="Contact" />
          </div>
        </div>
      </div>

      <!-- START MENU -->

      <div class="start-menu">
        <div class="start-pop-up">
          <div class="containerInput">
            <input placeholder="What app are you looking for?" type="text" />
          </div>

          <!-- PINNED -->

          <div class="pinned-section">
            <div class="section-title">
              <p>Pinned Apps</p>
            </div>

            <div class="pinned-grid">
              <div class="pinned-app">
                <img src="./assets/icons/work.png" alt="" />
                <span>Work</span>
              </div>

              <div class="pinned-app">
                <img src="./assets/icons/music.png" alt="" />
                <span>Music</span>
              </div>

              <div class="pinned-app">
                <img src="./assets/icons/archive.png" alt="" />
                <span>Archive</span>
              </div>

              <div class="pinned-app">
                <img src="./assets/icons/contact.png" alt="" />
                <span>Contact</span>
              </div>

              <div class="pinned-app">
                <img src="./assets/icons/contact.png" alt="" />
                <span>Trash</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
