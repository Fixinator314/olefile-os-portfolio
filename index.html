<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Olefile Makganye's Portfolio</title>
    <meta
      name="description"
      content="Official portfolio website for Olefile Makganye"
    />

    <!-- Fonts (premium feel) -->

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./assets/css/label.css" />
    <link rel="stylesheet" href="./assets/css/responses.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/HQ logo/HQ Logo.png"
      alt="HQ Logo"
    />

    <!-- GSAP -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script> -->
  </head>

  <body>
    <header class="system-navbar">
      <!-- LEFT -->

      <div class="system-left">
        <p class="system-name">Olefile Makganye OS</p>
      </div>

      <!-- RIGHT -->

      <div class="system-right">
        <div class="system-time">
          <p id="top-time">12:45</p>

          <span id="top-date"> 18 Sept 2026 </span>
        </div>

        <div class="system-item">
          <img src="./assets/Icons/wifi.png" alt="Network" />
        </div>

        <div class="system-item">
          <img
            src="./assets/Icons/volume-up-interface-symbol.png"
            alt="Volume"
          />
        </div>

        <div class="system-item battery">
          <img src="./assets/Icons/half-battery.png" alt="Battery" />

          <span>57%</span>
        </div>
      </div>

      <!-- ======================================== -->
      <!-- CALENDAR WIDGET -->
      <!-- ======================================== -->

      <div class="calendar-widget">
        <div class="calendar-header">
          <h3 id="calendar-month">September 2026</h3>
        </div>

        <div class="calendar-grid">
          <!-- DAYS -->

          <span>Sun</span>
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>

          <!-- DATES -->

          <div class="calendar-day empty"></div>
          <div class="calendar-day empty"></div>

          <div class="calendar-day">1</div>
          <div class="calendar-day">2</div>
          <div class="calendar-day">3</div>
          <div class="calendar-day">4</div>
          <div class="calendar-day">5</div>

          <div class="calendar-day">6</div>
          <div class="calendar-day">7</div>
          <div class="calendar-day">8</div>
          <div class="calendar-day">9</div>
          <div class="calendar-day">10</div>
          <div class="calendar-day">11</div>
          <div class="calendar-day">12</div>

          <div class="calendar-day">13</div>
          <div class="calendar-day">14</div>
          <div class="calendar-day">15</div>

          <!-- ACTIVE DAY -->

          <div class="calendar-day active-day">18</div>

          <div class="calendar-day">19</div>
        </div>
      </div>
    </header>
    <section class="os-desktop">
      <!-- <p class="label">Desktop View</p> -->

      <div class="task-bar">
        <!-- START BUTTON -->

        <div class="start-button">
          <img
            src="./assets/Logo/om-logo.png"
            alt="Logo"
            class="start-menu-logo"
          />
        </div>

        <!-- TASKBAR APPS -->

        <div class="taskbar-apps">
          <div class="taskbar-icon active-taskbar-app">
            <img
              src="./assets/Icons/communication.png"
              style="height: 60px; width: 50px"
              alt="Files"
            />
          </div>

          <div class="taskbar-icon">
            <img
              src="./assets/Icons/FL studio icon.png"
              style="height: 60px; width: 60px"
              alt="FL Studio"
            />
          </div>

          <div class="taskbar-icon">
            <img
              src="./assets/Icons/facebook.png"
              style="height: 50px; width: 50px"
              alt="Facebook"
            />
          </div>

          <div class="taskbar-icon">
            <img
              src="./assets/Icons/folder.png"
              style="height: 57px; width: 57px"
              alt="Files"
            />
          </div>

          <div class="taskbar-icon">
            <img
              src="./assets/Icons/github.png"
              style="height: 50px; width: 50px"
              alt="Github"
            />
          </div>

          <div class="taskbar-icon">
            <img
              src="./assets/Icons/web.png"
              style="height: 60px; width: 60px"
              alt="Internet"
            />
          </div>

          <div class="taskbar-icon">
            <img
              src="./assets/Icons/Trash-icon.png"
              style="height: 55px; width: 50px"
              alt="Trash"
            />
          </div>
        </div>
      </div>

      <!-- START MENU -->

      <div class="start-menu">
        <div class="start-pop-up">
          <div class="containerInput">
            <input placeholder="What app are you looking for?" type="text" />
          </div>

          <!-- PINNED -->

          <div class="pinned-section">
            <div class="section-title">
              <p>Pinned Apps</p>
            </div>

            <div class="pinned-grid">
              <div class="pinned-app">
                <img
                  src="./assets/Icons/facebook.png"
                  style="height: 60px; width: 50px"
                  alt="Facebook"
                />
                <span>Facebook</span>
              </div>

              <div class="pinned-app">
                <img
                  src="./assets/Icons/FL studio icon.png"
                  style="height: 60px; width: 60px"
                  alt="FL Studio"
                />
                <span>FL Studio</span>
              </div>

              <div class="pinned-app">
                <img
                  src="./assets/Icons/communication.png"
                  style="height: 60px; width: 60px"
                  alt="Files"
                />
                <span>Email</span>
              </div>

              <div class="pinned-app">
                <img
                  src="./assets/Icons/github.png"
                  style="height: 60px; width: 60px"
                  alt="Github"
                />
                <span>Github</span>
              </div>

              <div class="pinned-app">
                <img
                  src="./assets/Icons/web.png"
                  style="height: 60px; width: 60px"
                  alt="Internet"
                />
                <span>Internet</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
